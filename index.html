<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing-launchpad</title>
    <link rel="stylesheet" href="./styles/style.css">
    <!-- google font raleway -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<!-- inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <!-- nav section -->
        <nav class="nav-parent width-container">
            <h2 class="nav-logo">LOGO</h2>
            <button class="common-btn">Sign Up</button>
        </nav>

        <!-- banner section -->
        <section class="banner-section width-container">
            <h1 class="banner-title">Cool Dark UI Template for <br> Webflow Agencies!</h1>
            <button class="common-btn">Stay Focused</button>
        </section>
    </header>
    <main>
        <!-- action section -->
        <section class="action-section width-container">
            <!-- left action -->
             <div class="left-action">
                <h2>See It in Action</h2>
                <p>Explore the live preview and imagine your brand in this bold new look.</p>
                <button class="common-btn">Launch Live Preview</button>
             </div>
             <!-- right action -->
              <div class="right-action">
                <img class="action-img" src="./Assets/wc-mini.png" alt="">
              </div>
        </section>

        <!-- user section -->
         <section class="user-section width-container">
            <h2>Joined Thousands of Productive Users</h2>
            <div class="user-container">
                <div class="user-num">
                    <h1>50K</h1>
                    <span>Active Users</span>
                </div>
                <div class="user-num">
                    <h1>2M+</h1>
                    <span>Focus Sessions</span>
                </div>
                <div class="user-num">
                    <h1>95%</h1>
                    <span>Satisfaction Rate</span>
                </div>
            </div>
         </section>

         <!--  -->
    </main>
</body>
</html>
